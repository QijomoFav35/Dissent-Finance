# Runs every test in the repository on each push: the agent's tests, the demo page's tests in a
# headless browser, the contract's unit and property tests, and the sandbox tests that deploy the
# exact Sputnik DAO code mainnet runs next to the vault and drive it with real proposals, votes and
# five separate agent processes.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash -o pipefail, so a failed download fails its step.
defaults:
  run:
    shell: bash

jobs:
  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
        working-directory: agent
      - run: npm test
        working-directory: agent

  page:
    name: Demo page tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
        working-directory: tests/page
      - run: npx playwright install --with-deps chromium
        working-directory: tests/page
      - run: npm test
        working-directory: tests/page

  contract:
    name: Contract and sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Agent dependencies (the swarm test runs the real agent)
        run: npm ci
        working-directory: agent
      - name: Rust toolchains from each contract's rust-toolchain.toml
        run: |
          for d in contracts/vault contracts/test-usdc; do (cd "$d" && rustup toolchain install && rustup show active-toolchain); done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/vault
            contracts/test-usdc
      - name: cargo-near 0.23.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - name: Unit and property tests
        run: cargo test --lib
        working-directory: contracts/vault
      - name: End to end against the real Sputnik DAO
        run: cargo test --test sputnik_flow
        working-directory: contracts/vault
      - name: Five agent processes, no human after the vote
        run: cargo test --test swarm_scenario -- --nocapture
        working-directory: contracts/vault
